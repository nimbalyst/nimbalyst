			shellScript = "# Xcode build scripts run with a minimal PATH that excludes common\n# node install locations (Homebrew, nvm). Augment PATH so `node` and\n# the workspace-hoisted vite are resolvable.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(cat $HOME/.nvm/alias/default 2>/dev/null)/bin:$PATH\"\ncd \"${SRCROOT}/..\"\n# npm workspaces hoist vite to the monorepo root node_modules. The\n# previous package-local `node_modules/.bin/vite` check was always\n# false here and silently shipped a stale dist on every rebuild.\n# Invoke the hoisted binary directly and fail loudly if it's gone.\nVITE_BIN=\"${SRCROOT}/../../../node_modules/.bin/vite\"\nif [ ! -x \"$VITE_BIN\" ]; then\n  echo \"error: $VITE_BIN missing; run 'npm install' at the monorepo root\" >&2\n  exit 1\nfi\n\"$VITE_BIN\" build --config vite.config.transcript.ts\n# Copy transcript dist to Resources (clean first to remove stale hashed assets)\nrm -rf \"${SRCROOT}/Resources/transcript-dist\"\nmkdir -p \"${SRCROOT}/Resources/transcript-dist\"\ncp dist-transcript/transcript.html \"${SRCROOT}/Resources/transcript-dist/\"\ncp -R dist-transcript/assets \"${SRCROOT}/Resources/transcript-dist/\"\n";
