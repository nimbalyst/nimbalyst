name: NimbalystApp
options:
  bundleIdPrefix: com.nimbalyst
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "X8S24QHAT9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  NimbalystNative:
    path: ../NimbalystNative
schemes:
  NimbalystApp:
    build:
      targets:
        NimbalystApp: all
    run:
      config: Debug
      commandLineArguments: {}
    test:
      targets:
        - NimbalystNavigationUITests
targets:
  NimbalystNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NimbalystApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbalyst.navigation-tests
  NimbalystApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/transcript-dist
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/editor-dist
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: NimbalystNative
        product: NimbalystNative
      # Embeds the widget extension into PlugIns/. The Live Activity only exists
      # if this bundle ships inside the app.
      - target: NimbalystWidgets
    entitlements:
      path: Sources/NimbalystApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbalyst.app
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Vite emits content-hashed assets that cannot be listed before the build.
        # Xcode script sandboxing only permits exact output paths, not directory trees.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Transcript Web Bundle
        script: |
          # Xcode build scripts run with a minimal PATH that excludes common
          # node install locations (Homebrew, nvm). Augment PATH so `node` and
          # the workspace-hoisted vite are resolvable.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(cat $HOME/.nvm/alias/default 2>/dev/null)/bin:$PATH"
          cd "${SRCROOT}/.."
          # npm workspaces hoist vite to the monorepo root node_modules. The
          # previous package-local `node_modules/.bin/vite` check was always
          # false here and silently shipped a stale dist on every rebuild.
          # Invoke the hoisted binary directly and fail loudly if it's gone.
          VITE_BIN="${SRCROOT}/../../../node_modules/.bin/vite"
          if [ ! -x "$VITE_BIN" ]; then
            echo "error: $VITE_BIN missing; run 'npm install' at the monorepo root" >&2
            exit 1
          fi
          "$VITE_BIN" build --config vite.config.transcript.ts
          # Copy transcript dist to Resources (clean first to remove stale hashed assets)
          rm -rf "${SRCROOT}/Resources/transcript-dist"
          mkdir -p "${SRCROOT}/Resources/transcript-dist"
          cp dist-transcript/transcript.html "${SRCROOT}/Resources/transcript-dist/"
          cp -R dist-transcript/assets "${SRCROOT}/Resources/transcript-dist/"
        basedOnDependencyAnalysis: false
      - name: Build Editor Web Bundle
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(cat $HOME/.nvm/alias/default 2>/dev/null)/bin:$PATH"
          cd "${SRCROOT}/.."
          VITE_BIN="${SRCROOT}/../../../node_modules/.bin/vite"
          if [ ! -x "$VITE_BIN" ]; then
            echo "error: $VITE_BIN missing; run 'npm install' at the monorepo root" >&2
            exit 1
          fi
          "$VITE_BIN" build --config vite.config.editor.ts
          # Copy editor dist to Resources (clean first to remove stale hashed assets)
          rm -rf "${SRCROOT}/Resources/editor-dist"
          mkdir -p "${SRCROOT}/Resources/editor-dist"
          cp dist-editor/editor.html "${SRCROOT}/Resources/editor-dist/"
          cp -R dist-editor/assets "${SRCROOT}/Resources/editor-dist/"
        basedOnDependencyAnalysis: false

  NimbalystWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NimbalystWidgets
      # Target membership, not a package dependency. `NimbalystNative` pulls in
      # GRDB and PostHog, and a widget extension runs under a memory limit that
      # has no business paying for a database engine it will never open. Sharing
      # the files is also what Apple's own samples do for `ActivityAttributes`:
      # ActivityKit matches an activity to its attributes by the unqualified
      # type name, so app and extension must compile the same declaration.
      - path: ../NimbalystNative/Sources/LiveActivity/FleetActivityAttributes.swift
      - path: ../NimbalystNative/Sources/LiveActivity/FleetActivityFormatting.swift
      - path: ../NimbalystNative/Sources/Utils/NimbalystColors.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbalyst.app.widgets
        INFOPLIST_FILE: NimbalystWidgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
