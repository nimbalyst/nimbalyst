# Example relations for knowledge pages.
#
# A relation is a named link between two typed pages, with a name for each
# direction. It is a predicate in the project's registry with
# `valueShape: entity`. `subjectKinds` is the type of the page the link is
# written on and `objectKinds` the type of the page it points at; both accept a
# base type's subtypes through `extends`, and `['*']` accepts any type. The link
# menu offers a relation only when both pages' types fit, so a relation with no
# `objectKinds` is offered for every target and should be rare.
#
# These are EXAMPLES written against common types (module, technology,
# competitor, person). The project's own types decide what to define: rename
# the kinds to the project's type ids, and leave out anything the team does not
# need. A relation carries no qualifiers, and there is no generic "related to"
# or "depends on": a plain link already says that.
predicates:
  - id: built-on
    label: built on
    inverseLabel: underlies
    subjectKinds: [module, technology]
    objectKinds: [technology]
    valueShape: entity
    direction: directed

  - id: part-of
    label: is part of
    inverseLabel: contains
    subjectKinds: [module]
    objectKinds: [module]
    valueShape: entity
    direction: directed

  - id: implements
    label: implements
    inverseLabel: is implemented by
    subjectKinds: [module, technology]
    objectKinds: [technology]
    valueShape: entity
    direction: directed

  - id: alternative-to
    label: alternative to
    inverseLabel: alternative to
    subjectKinds: [technology]
    objectKinds: [technology]
    valueShape: entity
    direction: symmetric

  - id: competes-with
    label: competes with
    inverseLabel: has competitor
    subjectKinds: [competitor]
    objectKinds: [module]
    valueShape: entity
    direction: directed

  - id: owned-by
    label: owned by
    inverseLabel: owns
    subjectKinds: [module]
    objectKinds: [person]
    valueShape: entity
    direction: directed
