name: CI
run-name: "CI #${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded PRs can stop; main runs remain available to release consumers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make npm resilient to transient registry socket drops (ECONNRESET) on the
  # cache-miss path: retry individual failed requests instead of aborting the
  # whole `npm ci`. (Cache hits skip npm ci and make no registry calls at all.)
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '300000'

jobs:
  changes:
    name: Validation selection
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.select.outputs.docs-only }}
      sandbox: ${{ steps.select.outputs.sandbox }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  unit-tests:
    needs: changes
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # node_modules cache short-circuits `npm ci` (~75s -> ~5s) when dependency
      # metadata and patches are unchanged. We rely on exact-key match (no
      # restore-keys) so we never run with a partially-stale tree.
      - name: Cache node_modules
        if: needs.changes.outputs.docs-only != 'true'
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/extensions/*/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('**/package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: needs.changes.outputs.docs-only != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        env:
          # @vscode/ripgrep's postinstall resolves its prebuilt binary through
          # api.github.com; unauthenticated runners share a 60 req/hr limit per
          # egress IP and intermittently fail the whole install.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # tracker-core and extension-sdk are consumed through their built `dist`,
      # which only exists as a side effect of `npm ci` running their `prepare`
      # scripts. The install step above is skipped on a node_modules cache hit
      # and the cache does not carry those dist dirs, so build them explicitly
      # or downstream vite builds fail with: Failed to resolve entry for
      # package "@nimbalyst/tracker-core".
      - name: Build workspace deps
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs workspace-deps

      # docsUiStoreBinding.test.tsx imports the built bundle entry
      # (@nimbalyst/collab-bundle/docs-ui -> dist/docs-ui.js) on purpose: it
      # gates the store binding that only exists once the bundle is built. The
      # pre-push hook gets that dist for free because typecheck:prepush runs
      # the collab-bundle typecheck (which builds) before vitest; CI has to
      # build it explicitly or the import cannot resolve. Not cached: the
      # bundle pulls from runtime, collab-client, tracker-core, and protocol,
      # and a key that misses one of those inputs restores a stale bundle.
      - name: Build collab-bundle
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs bundle-build

      - name: Check override/dep sync
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run check:override-sync

      - name: Check tracked text files for raw NUL bytes
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run check:text-nuls -- --ref HEAD

      - name: Static invariants and scanner regression tests
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs scripts

      - name: Sandbox artifact and image checks
        if: needs.changes.outputs.sandbox == 'true'
        run: node scripts/run-validation.mjs sandbox

      - name: Run unit tests
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          set -o pipefail
          node scripts/run-validation.mjs unit 2>&1 | tee /tmp/vitest-ci.log

      - name: Record Vitest summary
        id: vitest-summary
        if: always() && needs.changes.outputs.docs-only != 'true'
        run: node scripts/record-vitest-summary.mjs /tmp/vitest-ci.log

  typecheck:
    needs: changes
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Cache node_modules
        if: needs.changes.outputs.docs-only != 'true'
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/extensions/*/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('**/package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: needs.changes.outputs.docs-only != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        env:
          # @vscode/ripgrep's postinstall resolves its prebuilt binary through
          # api.github.com; unauthenticated runners share a 60 req/hr limit per
          # egress IP and intermittently fail the whole install.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Build packages consumed through their `dist` (required before typecheck
      # and before the runtime build). See the note in the Unit Tests job: a
      # node_modules cache hit skips the install that would have built these.
      - name: Build workspace deps
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs workspace-deps

      - name: Public extension SDK smoke checks
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run extension-sdk:check-public

      # Cache the runtime build output (~46s vite build). Key includes
      # everything the build reads: runtime sources/config, extension-sdk
      # sources (consumed via workspace), dependency patches, and the lock file.
      # Never key this on the whole tree: that hash changes on every commit, so
      # the cache can only ever hit on a re-run of the same commit.
      - name: Cache runtime build
        if: needs.changes.outputs.docs-only != 'true'
        id: cache-runtime-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runtime/dist
          key: runtime-dist-${{ runner.os }}-node24-${{ hashFiles('packages/runtime/src/**', 'packages/runtime/vite.config.*', 'packages/runtime/package.json', 'packages/runtime/tsconfig*.json', 'packages/extension-sdk/src/**', 'package-lock.json', 'patches/**') }}

      - name: Build runtime
        if: needs.changes.outputs.docs-only != 'true' && steps.cache-runtime-dist.outputs.cache-hit != 'true'
        working-directory: packages/runtime
        run: npm run build

      # The cache contains the browser dist only. A cache miss builds dist-node
      # as part of the runtime build; a hit still needs its Node declarations.
      - name: Build Node runtime on cache hit
        if: needs.changes.outputs.docs-only != 'true' && steps.cache-runtime-dist.outputs.cache-hit == 'true'
        run: npm run build:node --workspace=@nimbalyst/runtime

      # This consumes runtime's built Node exports, so it must run after runtime
      # rather than in npm ci's workspace prepare lifecycle.
      - name: Build Node package
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run build --workspace=@nimbalyst/node

      - name: Typecheck every workspace from the shared inventory
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs typecheck-ready

  # Cheap Ubuntu smoke that catches transcript bundle breakage from runtime
  # changes without paying the 10x macOS multiplier. The full iOS simulator
  # workflow is separate; this job establishes only web transcript output.
  transcript-bundle:
    needs: changes
    name: Transcript Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Cache node_modules
        if: needs.changes.outputs.docs-only != 'true'
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/extensions/*/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('**/package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: needs.changes.outputs.docs-only != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        env:
          # @vscode/ripgrep's postinstall resolves its prebuilt binary through
          # api.github.com; unauthenticated runners share a 60 req/hr limit per
          # egress IP and intermittently fail the whole install.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # See the note in the Unit Tests job: a node_modules cache hit skips the
      # install that would have built these, and the transcript bundle pulls in
      # runtime source that imports @nimbalyst/tracker-core.
      - name: Build workspace deps
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs workspace-deps

      - name: Build transcript bundle
        if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/run-validation.mjs transcript

      - name: Verify transcript bundle output
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          if [ ! -f "packages/ios/dist-transcript/transcript.html" ]; then
            echo "Error: transcript.html not found in packages/ios/dist-transcript/"
            exit 1
          fi
          if [ ! -d "packages/ios/dist-transcript/assets" ]; then
            echo "Error: assets folder not found in packages/ios/dist-transcript/"
            exit 1
          fi
          du -sh packages/ios/dist-transcript

  # Note: the collaborative E2E specs in packages/electron/e2e/tracker/
  # (tracker-sync-collab.spec.ts, tracker-content-collab.spec.ts) are not
  # run in CI. They drive a real wrangler-dev TrackerRoom/DocumentRoom
  # from the nimbalyst-collab sibling repo, which is a separate project
  # and is not checked out here. The specs self-skip unless
  # RUN_COLLAB_TESTS=1 is set.
  #
  # To run them locally:
  #   1. Check out nimbalyst-collab as a sibling directory:
  #        git clone <nimbalyst-collab-url> ../nimbalyst-collab
  #        cd ../nimbalyst-collab && npm install
  #   2. From stravu-editor, start the dev server (npm run dev).
  #   3. RUN_COLLAB_TESTS=1 npx playwright test \
  #        e2e/tracker/tracker-sync-collab.spec.ts
  #
  # Override the server location with COLLAB_SERVER_PATH (relative to
  # the public repo root) if your nimbalyst-collab checkout is elsewhere.
