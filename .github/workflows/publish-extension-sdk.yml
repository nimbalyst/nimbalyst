name: Publish Extension SDK to npm

# Triggered manually only. Tag-based triggers used to live here, but
# pushing `extension-sdk-v*` tags to nimbalyst/nimbalyst polluted the
# repo's `releases.atom` feed: electron-updater's GitHub provider
# reads that feed and picks the topmost <entry>, so a stray SDK tag
# at the top of the feed 404'd the desktop app's update check.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version (must match packages/extension-sdk/package.json). Defaults to whatever is in package.json.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run (build and pack, but do not publish)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make pnpm resilient to transient registry socket drops (ECONNRESET): retry
  # individual failed requests instead of aborting the whole install.
  pnpm_config_fetch_retries: '5'
  pnpm_config_fetch_retry_mintimeout: '20000'
  pnpm_config_fetch_retry_maxtimeout: '120000'
  pnpm_config_fetch_timeout: '300000'

concurrency:
  group: publish-extension-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Verification and the dry-run path, split out of `publish` so checking a
  # release candidate never runs with publish authority. This job holds none:
  # no environment, no id-token.
  verify:
    name: Verify @nimbalyst/extension-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Reads the version from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        env:
          # @vscode/ripgrep's postinstall resolves its prebuilt binary through
          # api.github.com; unauthenticated runners share a 60 req/hr limit per
          # egress IP and intermittently fail the whole install.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify expected version matches package.json
        if: ${{ inputs.version != '' }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/extension-sdk/package.json').version")
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Expected version ($EXPECTED_VERSION) does not match packages/extension-sdk/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Run public release checks
        run: pnpm run extension-sdk:check-public

      # Same pack command the publish job uses.
      - name: Dry run pack
        working-directory: packages/extension-sdk
        run: pnpm pack --dry-run

  publish:
    name: Publish @nimbalyst/extension-sdk
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Adding this environment changes npm's OIDC subject claim from a ref-based
    # subject to an environment-based one. The npm trusted-publisher config for
    # @nimbalyst/extension-sdk must name `npm-publish` before this lands, or
    # publishing fails to authenticate. There is no npm write token here and
    # one must never be added as a workaround -- see MAINTAINERS.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Reads the version from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24 ships with npm >= 11.5.1, which is required for Trusted
          # Publishing. Earlier majors need an `npm install -g npm@latest`
          # upgrade step that hits a known self-replace bug on the runner.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        env:
          # @vscode/ripgrep's postinstall resolves its prebuilt binary through
          # api.github.com; unauthenticated runners share a 60 req/hr limit per
          # egress IP and intermittently fail the whole install.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `npm publish <tarball>` runs no lifecycle scripts, so the clean build
      # that `prepublishOnly` used to trigger happens here.
      - name: Build
        working-directory: packages/extension-sdk
        run: pnpm run build:clean

      # pnpm packs (rewriting any `workspace:*` specifiers to real versions);
      # npm publishes, so Trusted Publishing keeps going through npm's OIDC
      # exchange. `--provenance` is what triggers that exchange. Without it the
      # CLI publishes anonymously and bails on ENEEDAUTH even when
      # id-token: write is granted.
      - name: Publish to npm (Trusted Publishing via OIDC)
        working-directory: packages/extension-sdk
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/extension-sdk-package"
          mkdir -p "$PACK_DIR"
          pnpm pack --pack-destination "$PACK_DIR"
          TARBALL=$(ls "$PACK_DIR"/*.tgz)
          npm publish "$TARBALL" --access public --provenance

      - name: Summary
        run: |
          VERSION=$(node -p "require('./packages/extension-sdk/package.json').version")
          echo "Published @nimbalyst/extension-sdk@$VERSION"
          echo "https://www.npmjs.com/package/@nimbalyst/extension-sdk/v/$VERSION"
