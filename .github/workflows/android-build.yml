# Android Build
#
# Two paths, deliberately separated by trust:
#
#   android-validate  runs on pushes to main and on pull requests. It receives
#                     NO secrets at all and produces an UNSIGNED release APK and
#                     AAB. A pull request that edits this workflow therefore
#                     cannot reach the signing keystore.
#
#   android-release   runs only for an `android/v*` tag or an authorized manual
#                     dispatch, and is bound to the `android-release` protected
#                     environment. The keystore lives in that environment's
#                     secrets and nowhere else.
#
# The signed job rebuilds from the protected ref rather than signing an artifact
# produced by the validation job -- an artifact built from an unreviewed ref is
# contributor-controlled input, and signing it would put the credential back on
# the wrong side of the boundary.
#
# Google Play publishing is intentionally OUT OF SCOPE here. This workflow only
# builds, unit-tests, asserts the bundled transcript, and uploads artifacts.

name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'packages/android/**'
      - 'packages/runtime/**'
      - '.github/workflows/android-build.yml'
      - '.github/actions/android-build/**'
    tags:
      - 'android/v*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/android/**'
      - 'packages/runtime/**'
      - '.github/workflows/android-build.yml'
      - '.github/actions/android-build/**'
  workflow_dispatch:
    inputs:
      signed:
        description: 'Produce a signed release build (uses android-release keystore secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Make pnpm resilient to transient registry socket drops (ECONNRESET) on the
  # cache-miss path. On a cache hit the install is skipped entirely, so these
  # only matter when the lockfile changed and packages must be fetched.
  pnpm_config_fetch_retries: '5'
  pnpm_config_fetch_retry_mintimeout: '20000'
  pnpm_config_fetch_retry_maxtimeout: '120000'
  pnpm_config_fetch_timeout: '300000'

jobs:
  # Unsigned validation. No `environment:`, and no `secrets.*` reference
  # anywhere in this job -- that absence is the security property, so do not
  # add one here.
  android-validate:
    name: Android Build
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.signed == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build Android artifacts (unsigned)
        uses: ./.github/actions/android-build
        with:
          signed: 'false'

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-apk
          path: packages/android/app/build/outputs/apk/release/*.apk

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-aab
          path: packages/android/app/build/outputs/bundle/release/*.aab

  # Signed release. Reachable only from a protected `android/v*` tag or an
  # authorized dispatch, and gated on the `android-release` environment review.
  android-release:
    name: Android Signed Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android/v') || (github.event_name == 'workflow_dispatch' && inputs.signed == 'true')
    environment: android-release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # versionName comes from packages/electron/package.json (build.gradle.kts).
      # A tag `android/vX.Y.Z` must name that version; `android/vX.Y.Z.N` sets
      # the Android rebuild slot N so the same train can be re-uploaded to Play.
      - name: Check tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/android/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#android/v}"
          DESKTOP_VERSION=$(node -p "require('./packages/electron/package.json').version")
          BASE="${TAG_VERSION%.*}"
          if [ "$TAG_VERSION" = "$DESKTOP_VERSION" ]; then
            BUILD_NUMBER=0
          elif [ "$BASE" = "$DESKTOP_VERSION" ]; then
            BUILD_NUMBER="${TAG_VERSION##*.}"
          else
            echo "Error: tag $GITHUB_REF_NAME does not match desktop version $DESKTOP_VERSION"
            exit 1
          fi
          echo "NIMBALYST_ANDROID_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build Android artifacts (signed)
        uses: ./.github/actions/android-build
        with:
          signed: 'true'
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          google-services-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: packages/android/app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-aab
          path: packages/android/app/build/outputs/bundle/release/*.aab
