# pnpm reads every non-auth setting from this file (pnpm 11+). `.npmrc` only
# carries registry/auth.
packages:
  - packages/electron
  - packages/runtime
  - packages/cli
  - packages/node
  - packages/tracker-core
  - packages/tracker-schema
  - packages/tracker-engine
  - packages/collab-protocol
  - packages/collab-client
  - packages/collab-bundle
  - packages/collab-adapters
  - packages/markdown-ydoc
  - packages/tracker-builtins
  - packages/local-wiki
  - packages/wiki-web
  - packages/web-editors
  - packages/ios
  - packages/android
  - packages/extension-sdk
  - packages/extension-sdk-docs/examples/*
  - packages/extensions/*
  - packages/extensions/nimbalyst-memory/engine
  - packages/marketplace
  - packages/opencode-plugin
  - packages/browser-extension
  - packages/cloudflare-sandbox

# Flat node_modules like npm's. electron-builder packaging, the extraResources
# list, and several build scripts still expect one hoisted tree.
nodeLinker: hoisted

engineStrict: true

# Release cooldown: never resolve a version published less than 72 hours ago.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # 2026-11-20: claude-agent-sdk 0.3.329 (background-agent interrupt status fix, idle-session memory release).
  # Remove once it clears the cooldown (2026-11-22).
  - '@anthropic-ai/claude-agent-sdk@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.329'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.329'
  # 2026-11-20: codex-sdk 0.171.0 (GPT-6.2 model catalog, approval and permission-profile fixes).
  # Remove once it clears the cooldown (2026-11-23).
  - '@openai/codex-sdk@0.171.0'
  - '@openai/codex@0.171.0'
  - '@openai/codex@0.171.0-darwin-arm64'
  - '@openai/codex@0.171.0-darwin-x64'
  - '@openai/codex@0.171.0-linux-arm64'
  - '@openai/codex@0.171.0-linux-x64'
  - '@openai/codex@0.171.0-win32-arm64'
  - '@openai/codex@0.171.0-win32-x64'
  # 2026-11-20: Electron 45.4.1 (desktop runtime upgrade, published 2026-11-19 02:04 UTC).
  # Remove once it clears the cooldown (2026-11-22).
  - 'electron@45.4.1'

# `pnpm run` should not silently start an install: parallel agent sessions share
# a checkout, and two concurrent installs corrupt node_modules.
verifyDepsBeforeRun: warn

# Packages allowed to run install scripts. Anything else that wants to build
# fails the install (strictDepBuilds) until it is listed here as true or false.
allowBuilds:
  '@fortawesome/fontawesome-free': true
  '@vscode/ripgrep': true
  better-sqlite3: true
  bufferutil: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fsevents: true
  leveldown: true
  node-pty: true
  onnxruntime-node: true
  # postinstall only prints a version-mismatch hint
  protobufjs: false
  sharp: true
  utf-8-validate: true
  workerd: true

# y-websocket lists y-leveldb as optional; only its server utils use it. Its
# native leveldown cannot build on Windows ARM64, and a missing optional
# production dependency makes electron-builder fail the pack step there.
ignoredOptionalDependencies:
  - y-leveldb

overrides:
  # Transformers 3.8.1 declares Sharp 0.34, which bundles vulnerable native image libraries.
  # Remove when a Transformers release supports patched Sharp and our Intel Mac target.
  '@huggingface/transformers@3.8.1>sharp': 0.35.5
  '@anthropic-ai/claude-agent-sdk': 0.3.329
  prismjs: ^1.30.0
  vite: 7.3.7
  zod: 4.6.7
  concurrently>shell-quote: 1.12.0
  minimatch@^10.0.0: ^10.2.5
  dompurify: 3.4.17
  # GHSA-238p-pmpm-9mq7 (fixed in 0.18.2). mermaid 11, rehype-katex and
  # micromark-extension-math still declare ^0.16; mermaid 12 moved to ^0.18.
  katex: ^0.18.11
  lodash-es: ^4.18.1
  '@excalidraw/excalidraw>nanoid': ^3.3.18
  '@excalidraw/mermaid-to-excalidraw>nanoid': ^5.1.16
  # @electron/rebuild 4.2.0 resolves node-abi 4.33.0, which has no ABI entry for
  # Electron 45 and throws during the native rebuild. 4.36.0 is the first release
  # that maps Electron 45 to ABI 150. Remove when @electron/rebuild pulls it in.
  '@electron/rebuild>node-abi': 4.36.0

patchedDependencies:
  '@lexical/yjs@0.53.0': patches/@lexical__yjs@0.53.0.patch
  '@revolist/revogrid@4.21.4': patches/@revolist__revogrid@4.21.4.patch
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  ghostty-web@0.4.0-next.20.g1858a59: patches/ghostty-web@0.4.0-next.20.g1858a59.patch
  react-dom@19.2.7: patches/react-dom@19.2.7.patch
